name: Demo

# Publishes the static demo under site/ to GitHub Pages.
#
# Pages serves files; it does not run the application. What deploys here is the game loop in
# JavaScript, not the WAR -- accounts, score history and import/export need a server. The demo
# says so on the page.
#
# questions.json is generated here rather than committed, so the demo cannot drift from the
# question set the real app ships.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/questions-to-json.py
      - src/main/resources/Data/QuestionData.csv
      - src/main/resources/static/images/Trivial-Trivia.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

# Not cancel-in-progress: cancelling a half-finished deploy leaves Pages on the old build with a
# red run next to it, and these take seconds anyway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Assemble
        run: |
          mkdir -p _site
          cp site/index.html site/style.css site/demo.js _site/
          cp src/main/resources/static/images/Trivial-Trivia.jpg _site/
          python scripts/questions-to-json.py \
            src/main/resources/Data/QuestionData.csv _site/questions.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
