# No datasource URL on purpose. Spring Boot does not bind DATABASE_URL -- an app handed a
# PostgreSQL instance through it started on an in-memory H2, migrated that, and logged nothing.
# What it binds is SPRING_DATASOURCE_URL, and DatabaseUrl translates a postgres:// DATABASE_URL
# into it. If neither is set, this stops the context rather than falling back to an embedded H2
# that loses every account on the next restart.
spring.datasource.embedded-database-connection=none

# The host terminates TLS and forwards, so without this Spring Security's redirects come back as
# http:// and a browser on https:// refuses to follow them.
server.forward-headers-strategy=framework

# The host terminates TLS, so the cookie never legitimately travels over http here.
server.servlet.session.cookie.secure=true
