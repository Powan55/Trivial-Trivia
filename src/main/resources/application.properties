spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Development unless something asks for production. The production profile carries no datasource
# URL, so a misconfigured deploy fails to start instead of quietly running on a database that
# evaporates on the next restart.
spring.profiles.default=dev

# Where the H2 file and any leftover 1.0 CSVs live.
app.data.dir=${user.home}/.trivial-trivia

# A question set is a few kilobytes. This caps what the import endpoint will parse.
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=256KB

# One instance with a tenth of a CPU serving one page at a time. Three connections is more than
# it can use and small enough for a free Postgres tier's own limit.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# A free database sleeps too. Flyway's default is not to retry at all, which took the whole app
# down at boot in 7 seconds against a database that was only waking up.
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=3s
