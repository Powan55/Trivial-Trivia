spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Development unless something asks for production. The production profile carries no datasource
# URL, so a misconfigured deploy fails to start instead of quietly running on a database that
# evaporates on the next restart.
spring.profiles.default=dev

# Where the H2 file and any leftover 1.0 CSVs live.
app.data.dir=${user.home}/.trivial-trivia

# A question set is a few kilobytes. This caps what the import endpoint will parse.
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=256KB

# One instance with a tenth of a CPU serving one page at a time. Three connections is more than
# it can use and small enough for a free Postgres tier's own limit.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# A free database sleeps too. Flyway's default is not to retry at all, which took the whole app
# down at boot in 7 seconds against a database that was only waking up.
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=3s

# Boot 3 runs the security filter on every dispatcher type, forwards included, and rendering a
# JSP view is a forward to /WEB-INF/views/*.jsp -- which no rule permits, so every page answered
# 302 to the sign-in page, including the sign-in page. Authorisation already ran on the request.
spring.security.filter.dispatcher-types=request,error,async

# Spring Security sends no-store on everything it has not been told otherwise about, so every
# navigation re-fetched all of base.css, the page's sheet, theme.js and the 151KB logo -- about
# 170KB a page on an instance with a tenth of a CPU. Setting a period here makes the resource
# handler write its own Cache-Control, which Security then leaves alone.
#
# Five minutes, not an hour: the filenames carry no content hash, so this is also the window in
# which a visitor can keep seeing the old stylesheet after a deploy. Five covers a whole visit,
# which is where all of the benefit is -- nobody returns within the hour -- while keeping the
# stale-sheet ceiling to something a reload fixes.
spring.web.resources.cache.period=300

# Tomcat sets HttpOnly by default and nothing sets SameSite, so the session cookie went out with
# neither a SameSite nor a Secure attribute. Lax, not Strict: sign-in has to survive a link
# followed in from somewhere else. Secure is set under prod only -- true here would stop the
# cookie working over plain http locally.
server.servlet.session.cookie.same-site=lax
